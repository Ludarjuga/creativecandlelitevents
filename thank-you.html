<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Creative Candlelit Events</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c2974e;--gold-soft:#d9bd86;--dark:#1d150f;--dark2:#2a1d13;--glow:rgba(212,150,70,0.4)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Jost',sans-serif;font-weight:300;background:radial-gradient(ellipse at 50% 120%,var(--dark2) 0%,var(--dark) 65%);color:#e9dcc4;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
  .flame{font-size:2rem;display:inline-block;animation:flicker 3s ease-in-out infinite;margin-bottom:1.4rem}
  @keyframes flicker{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.75;transform:scale(1.06)}}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2rem,5vw,3rem);color:#f6ecd9;margin-bottom:1rem}
  h1 em{color:var(--gold-soft)}
  p{max-width:480px;margin:0 auto 0.8rem;color:#cdbfa8}
  a.btn{display:inline-block;margin-top:1.8rem;text-decoration:none;font-size:0.82rem;letter-spacing:0.18em;text-transform:uppercase;padding:0.9rem 2.2rem;border-radius:2.5rem;background:linear-gradient(135deg,var(--gold) 0%,#a87c34 100%);color:#fff8ea}
  a{color:var(--gold-soft)}
</style>
</head>
<body>
<div>
  <span class="flame">🕯️</span>
  <h1>Thank you — <em>we received your request</em></h1>
  <p>We'll get back to you within 1–2 business days with availability and next steps for your candlelit evening.</p>
  <p>In the meantime, follow along on Instagram: <a href="https://www.instagram.com/creative.candlelit.events.atl" target="_blank" rel="noopener">@creative.candlelit.events.atl</a></p>
  <a class="btn" href="index.html">Back to the Website</a>
</div>
</body>
</html>
